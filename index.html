<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%23F4C542'/%3E%3Crect x='5' y='6.5' width='22' height='15.5' rx='2' fill='%231F4F44'/%3E%3Crect x='8' y='9.5' width='7' height='3.2' rx='1' fill='%23F6F4E8'/%3E%3Crect x='17' y='9.5' width='7' height='3.2' rx='1' fill='%23F4C542'/%3E%3Crect x='8' y='15.5' width='12' height='3.2' rx='1' fill='%23F6F4E8'/%3E%3C/svg%3E">
<title>초등학교 업무분장 한눈에</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="초등학교 업무분장 표준안, 협의 업무, 분장표 점검, 초안 만들기를 한곳에서.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃 개념: 교무실 벽의 자석 배치판. 초록 칠판 띠 위에 업무 자석을 붙이고, 그 외 화면은 차분한 표. */
:root{
  --paper:#F1F5F1;--surface:#FFFFFF;--sunk:#E6EDE8;--ink:#17302A;--muted:#566B64;--line:#D3DDD7;
  --board:#1F4F44;--board-2:#173E35;--chalk:#F6F4E8;--chalk-dim:#BBD0C7;--sun:#F4C542;--sun-ink:#3B2E00;
  --edu:#1C7560;--edu-bg:#DDEFE9;--bnd:#55697A;--bnd-bg:#E5EBF0;--adm:#2B5C9A;--adm-bg:#E0EAF7;--neu:#AD3B72;--neu-bg:#F8E3EE;--aide:#5B4A9E;--aide-bg:#ECE8F8;
  --ok:#1C7560;--warn:#B65F0E;--bad:#BB3333;--bad-ink:#FFFFFF;--bad-bg:#FBE4E2;
  --disp:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --wrap:720px;--magnet-ink:#23352F;--magnet:0 1px 0 rgba(255,255,255,.5) inset,0 1px 2px rgba(10,40,30,.25);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1F1B;--surface:#172A25;--sunk:#1E352F;--ink:#E5EEE9;--muted:#9FB4AC;--line:#2D463F;
  --board:#1B463C;--board-2:#143730;--edu:#5CC4A7;--edu-bg:#1B3D35;--bnd:#B4C6D4;--bnd-bg:#2A3843;--adm:#8DB7EC;--adm-bg:#1F3350;--neu:#EC93BC;--neu-bg:#452338;--aide:#BEB1F0;--aide-bg:#2C2748;
  --ok:#5CC4A7;--warn:#EFA65B;--bad:#F08D85;--bad-ink:#3A0E0B;--bad-bg:#472422;--magnet:0 1px 2px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1F1B;--surface:#172A25;--sunk:#1E352F;--ink:#E5EEE9;--muted:#9FB4AC;--line:#2D463F;
  --board:#1B463C;--board-2:#143730;--edu:#5CC4A7;--edu-bg:#1B3D35;--bnd:#B4C6D4;--bnd-bg:#2A3843;--adm:#8DB7EC;--adm-bg:#1F3350;--neu:#EC93BC;--neu-bg:#452338;--aide:#BEB1F0;--aide-bg:#2C2748;
  --ok:#5CC4A7;--warn:#EFA65B;--bad:#F08D85;--bad-ink:#3A0E0B;--bad-bg:#472422;--magnet:0 1px 2px rgba(0,0,0,.5);color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.65 var(--body);word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--board-2)}
h1,h2,h3{font-family:var(--disp);font-weight:700;letter-spacing:-.01em;line-height:1.25;text-wrap:balance;margin:0}
h2{font-size:30px}h3{font-size:20px}p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:4px}
.wrap{width:100%;max-width:var(--wrap);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.wide main{--wrap:1920px}body.wide main .wrap{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--board-2);color:var(--chalk)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:58px}
.logo{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:9px;font:700 21px/1.1 var(--disp);color:var(--chalk);white-space:nowrap}.lg-i{flex:none}.lg-t{display:grid;gap:1px}.lg-t small{font:600 12px/1.1 var(--body);color:var(--sun);letter-spacing:.04em}
.logo:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
nav.tabs{display:flex;gap:2px;margin-left:auto}
nav.tabs button{border:0;background:none;color:var(--chalk-dim);padding:7px 11px;border-radius:7px;font-weight:600;font-size:14px;white-space:nowrap}
nav.tabs button:hover{color:var(--chalk)}
nav.tabs button[aria-current="page"]{background:var(--sun);color:var(--sun-ink)}
main{padding-bottom:40px}
.view{padding-block:28px;display:grid;gap:22px;min-width:0}

.lede{color:var(--muted);max-width:62ch}
.head{display:grid;gap:8px}
/* 홈 칠판 */
.hero{background:linear-gradient(170deg,var(--board),var(--board-2));color:var(--chalk)}
.hero .wrap{padding-block:34px 30px;display:grid;gap:22px}
.hero h1{font-size:clamp(36px,8vw,54px)}
.hero p{color:var(--chalk-dim);max-width:46ch}
.demo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.demo section{min-width:0;display:grid;gap:7px;align-content:start;border:1px dashed rgba(246,244,232,.28);border-radius:8px;padding:10px}
.demo h3{font-size:15px;color:var(--sun)}
.demo span{display:block;background:var(--chalk);color:#23352F;border-radius:6px;padding:4px 8px;font-size:13px;font-weight:500;box-shadow:0 2px 3px rgba(0,0,0,.28);animation:snap .38s cubic-bezier(.3,1.5,.5,1) backwards}
.demo span.b{background:#FAD9A8}
.demo span:nth-child(3){animation-delay:.1s}.demo span:nth-child(4){animation-delay:.2s}.demo span:nth-child(5){animation-delay:.3s}
@keyframes snap{from{transform:translateY(-12px) scale(1.06);opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.menu{display:grid;gap:0;border-top:1px solid var(--line)}
.menu button{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:15px 4px;border-bottom:1px solid var(--line)}
.menu button:focus-visible{outline:3px solid var(--sun)}
.menu b{font:700 21px var(--disp)}
.menu span{color:var(--muted);grid-column:1}
.menu em{font-style:normal;grid-column:2;grid-row:1/3;align-self:center;font-weight:600;color:var(--edu);font-variant-numeric:tabular-nums}
.menu button:hover b{color:var(--edu)}
.note{font-size:13.5px;color:var(--muted)}
/* 공통 컨트롤 */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--edu)}
.btn.main{background:var(--board);border-color:var(--board);color:var(--chalk)}
.btn.main:hover{background:var(--board-2)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.reset{background:var(--bad);border-color:var(--bad);color:var(--bad-ink);font-weight:700}.btn.reset:hover{filter:brightness(.92);background:var(--bad);color:var(--bad-ink)}.rs-op{display:grid;gap:4px;margin:0 0 10px}.rs-op .btn{justify-self:stretch}.rs-op .note{margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tag{display:inline-block;border-radius:5px;padding:0 6px;font-size:12px;font-weight:600;white-space:nowrap;line-height:20px}
.k-교원{background:var(--edu-bg);color:var(--edu)}.k-협의{background:var(--bnd-bg);color:var(--bnd)}.k-행정{background:var(--adm-bg);color:var(--adm)}.k-늘봄{background:var(--neu-bg);color:var(--neu)}
/* 표준안 */
.stdhero .wrap{padding-block:26px 20px;gap:14px}
.stdhero h2{font-size:clamp(30px,6vw,40px)}
.stdhero .search{border-color:transparent;background:var(--chalk);color:var(--magnet-ink)}
.stdhero .search::placeholder{color:#63756E}
.map-lab{font-size:13px;color:var(--chalk-dim);margin:10px 0 5px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.tile{display:flex;justify-content:space-between;align-items:baseline;gap:6px;border:0;border-radius:7px;padding:6px 9px;background:var(--chalk);color:var(--magnet-ink);box-shadow:0 2px 3px rgba(0,0,0,.28);min-width:0}
.tile b{font:700 16px var(--disp);white-space:nowrap}.tile span{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:#4F635C}
.tile:hover{background:var(--sun)}.tile:disabled{opacity:.32;cursor:default;box-shadow:none;background:var(--chalk)}
.map-foot{justify-content:space-between;margin-top:12px}
.tog{display:inline-flex;align-items:center;gap:7px;border:1px dashed rgba(246,244,232,.5);border-radius:7px;background:none;color:var(--chalk);padding:5px 10px;font-size:14px;font-weight:600}
.tog i{width:9px;height:9px;border-radius:50%;background:var(--chalk-dim)}
.tog[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.tog[aria-pressed="true"] i{background:var(--bnd)}
.note-c{font-size:14px;color:var(--chalk)}
.std-legend{display:grid;gap:3px}.std-legend>div{display:flex;flex-wrap:wrap;gap:3px 14px}.std-legend .lg{display:inline-flex;align-items:center;gap:6px}
.std-legend i{margin:0 5px 0 0}.std-legend .sig i{margin:0;width:3px;border-radius:1px}
#stdL{display:grid;gap:22px}
.std-group{display:grid;gap:0;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 66px + var(--sbar,76px))}
.std-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px + var(--sbar,76px));z-index:5;display:flex;align-items:center;gap:10px;background:var(--board);color:var(--chalk);padding:8px 12px;border-radius:8px;font-size:21px}
.std-head.stuck{border-radius:0 0 8px 8px;box-shadow:0 3px 8px rgba(8,30,24,.22)}
.std-head .coop{font:500 13px var(--body);color:var(--chalk-dim);white-space:nowrap}
.std-head .pos{margin-left:auto;font:500 13px var(--body);color:var(--chalk-dim);font-variant-numeric:tabular-nums}
.std-head .up{border:1px solid rgba(246,244,232,.35);background:none;color:var(--chalk);border-radius:6px;padding:1px 8px;font:500 12.5px var(--body);white-space:nowrap}
.std-head .up:hover{background:rgba(246,244,232,.14)}
.std{border-bottom:1px solid var(--line)}
details.std summary{list-style:none;cursor:pointer}
details.std summary,.std.flat .sm{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto 20px;gap:2px 8px;align-items:center;padding:6px 4px}
details.std summary::-webkit-details-marker{display:none}
.std .dot{grid-column:1}.std summary b,.std .sm b{grid-column:2}.std summary .tag,.std .sm .tag{grid-column:3}.std summary .sig,.std .sm .sig{grid-column:4}.std .plus{grid-column:5}
details.std summary:hover b{color:var(--edu)}
.std summary b,.std .sm b{font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--edu)}
.d-협의{background:var(--bnd)}.d-행정{background:var(--adm)}.d-늘봄{background:var(--neu)}
.sig{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.sig i{display:block;width:4px;background:var(--line);border-radius:1px}
.sig i:nth-child(1){height:6px}.sig i:nth-child(2){height:10px}.sig i:nth-child(3){height:14px}
.sig i.on{background:var(--ink)}
.plus{position:relative;width:14px;height:14px;justify-self:end;color:var(--muted)}
.plus::before,.plus::after{content:"";position:absolute;left:1px;right:1px;top:6px;height:2px;background:currentColor;transition:transform .15s}
.plus::after{transform:rotate(90deg)}
details.std[open] .plus::after{transform:none}
details.std[open]>summary{background:var(--sunk)}
details.std .more{display:grid;gap:10px;padding:8px 12px 13px 20px;font-size:14px;background:var(--sunk)}
.more p{margin:0}.more h5{margin:0 0 4px;font:600 12.5px var(--body);color:var(--muted)}
.alts{display:flex;flex-wrap:wrap;gap:4px}
.alts span{background:var(--surface);border-radius:5px;padding:1px 7px;font-size:13px;box-shadow:var(--magnet)}
.dist{display:grid;grid-template-columns:76px minmax(0,1fr) 42px;gap:8px;align-items:center;font-size:13px}
.dist div{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.dist i{display:block;height:100%;background:var(--edu)}
.dist b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.std-sub{margin:0;padding:12px 4px 6px;font:700 17px var(--disp);color:var(--neu);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.std-sub.adm{color:var(--adm)}
.std-group .std-sub{color:var(--edu)}.std-group[id="sec-늘봄학교"] .std-sub{color:var(--neu)}.std-group .std-sub.adm{color:var(--adm)}
.std-sub small{font:500 13px var(--body);color:var(--muted)}
details.opt>summary{cursor:pointer;padding:9px 4px;color:var(--muted);font-size:14px;font-weight:600;border-bottom:1px solid var(--line)}
details.opt>summary:hover{color:var(--edu)}
/* 협의 */
.ex-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.prog{font-size:15px;color:var(--chalk)}.prog b{font:700 26px var(--disp);color:var(--sun);font-variant-numeric:tabular-nums}
.tile.done{background:var(--sun);color:var(--sun-ink)}.tile.done span{color:var(--sun-ink)}
#bndL{display:grid;gap:0}
.bd-t{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ok-tag{background:var(--edu-bg);color:var(--edu)}
.now{font-size:13.5px;color:var(--muted)}
.exl{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:5px 8px}
.saved{font-size:12.5px;color:var(--edu)}.saved:empty{display:none}
.bd textarea{min-height:40px;overflow:hidden;resize:none}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pk{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px}
.pk:hover{border-color:var(--edu)}
.pk[aria-pressed="true"]{background:var(--board);border-color:var(--board);color:var(--chalk)}
.bd{display:grid;gap:6px;padding-block:13px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 66px);border-bottom:1px solid var(--line)}
.bd h3{font-size:19px}
textarea,.field{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);resize:vertical}
/* 점검 */
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;display:grid;gap:8px;background:var(--surface)}
.drop.over{border-color:var(--edu);background:var(--edu-bg)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stats button{all:unset;cursor:pointer;display:grid;padding:9px 11px;border-radius:8px;background:var(--chalk);color:var(--magnet-ink);box-shadow:0 2px 3px rgba(0,0,0,.28)}
.stats button:focus-visible{outline:3px solid var(--sun)}
.stats button[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink)}
.stats b{font:700 27px/1.1 var(--disp);font-variant-numeric:tabular-nums}.stats span{font-size:13px}
.ck-file{color:var(--chalk);font-size:19px;min-width:0}
.ck-sum{color:var(--chalk);font-size:16px;max-width:none}.ck-sum b{font:700 26px var(--disp);color:var(--sun)}
.hero p.ck-done{font-size:13.5px;color:var(--chalk-dim)}
.ck-act .btn{white-space:nowrap}.hero .btn:not(.sun){color:var(--ink)}.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.back{justify-self:start;width:max-content;border:1px solid rgba(246,244,232,.5);background:none;color:var(--chalk);border-radius:7px;padding:4px 10px;font-size:14px;font-weight:600}
.back:hover{background:rgba(246,244,232,.14)}
.to-top{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 13px;font-size:13.5px;font-weight:600;box-shadow:0 2px 8px rgba(8,30,24,.2)}
.ck-ex{display:grid;gap:6px;padding:12px 14px;background:var(--sunk);border-radius:10px;justify-items:start}
.ck-ex h3{font-size:17px}.ck-exl{display:flex;gap:14px;width:100%;font-size:14px;justify-content:space-between}.ck-exl em{font-style:normal;color:var(--muted)}
.ck-h{font-size:22px;margin-bottom:6px}
.ck-g{border-bottom:1px solid var(--line)}
.ck-g>summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 4px;list-style:none}
.ck-g>summary::-webkit-details-marker{display:none}
.ck-g>summary b{font:700 19px var(--disp)}.ck-g>summary span{font-size:13.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.ck-g>summary:hover b{color:var(--edu)}
.ck-big{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;background:var(--sunk);border-radius:8px;padding:9px 11px;margin-bottom:6px;font-size:14px}
.pk.sm{padding:4px 9px;font-size:13px;white-space:nowrap}
.ck-bar{display:none}
.res{display:flex;flex-wrap:wrap;justify-content:space-between;gap:5px 10px;padding:8px 4px;border-top:1px solid var(--line);align-items:center}
.res>div:first-child{min-width:0;flex:1 1 220px;display:grid}
.res small{color:var(--muted);font-size:13px}
.res .act{display:flex;gap:5px}
.banner{padding:10px 13px;border-radius:9px;background:var(--sunk);font-size:14px}
.banner.warn{background:var(--bad-bg);color:var(--bad);font-weight:600}.banner.good{background:var(--edu-bg);color:var(--edu);font-weight:600}
.err{background:var(--bad-bg);color:var(--bad);padding:10px 13px;border-radius:9px}
/* 만들기 */
.setup{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.setup summary{cursor:pointer;padding:10px 16px;font:700 19px var(--disp)}
.setup .in{padding:0 16px 14px;display:grid;gap:10px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:4px 10px}
.nums label{display:grid;gap:2px;align-content:end;font-size:13px;color:var(--muted)}
.nums input{width:100%;padding:3px 7px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.nums h4,.setup h4{grid-column:1/-1;margin:6px 0 0;font:600 14px var(--body);color:var(--ink)}
.checks{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px + var(--bar,120px));display:grid;gap:10px;max-height:calc(100vh - 84px - var(--bar,120px));overflow:auto;padding:1px}
.tray{background:var(--board);color:var(--chalk);border-radius:12px;padding:12px;display:grid;gap:8px}
.tray h3{font-size:18px}.tray .slot{min-height:48px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.tray p{font-size:13px;color:var(--chalk-dim)}
.tray.over,.card.over{outline:3px solid var(--sun);outline-offset:1px}
